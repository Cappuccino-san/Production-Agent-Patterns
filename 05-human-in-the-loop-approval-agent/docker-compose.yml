services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: human-in-the-loop-approval-agent
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/approvals.db
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - API_PREFIX=/api/v1
    volumes:
      - approval-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  approval-data:
    driver: local
