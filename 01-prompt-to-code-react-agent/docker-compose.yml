services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prompt-to-code-react-agent
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/agent_runs.db
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - agent-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  agent-data:
    driver: local
