[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    unit: Isolated unit tests for functions, schemas, and utilities
    graph: Tests validating LangGraph nodes, state mutations, and edge routing
    db: Tests validating SQLite WAL mode, FTS5 triggers, and persistence queries
    api: Tests validating FastAPI endpoints, status codes, and HTTP contracts
    boundary: Tests validating edge cases, timeouts, malformed inputs, and recovery
asyncio_mode = auto
